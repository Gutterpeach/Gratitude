    .tab-btn.active { background-color: #6A517D; color: #FFFFFF; }
    
    .gratitude-input { width: 100%; padding: 12px; margin-bottom: 12px; border: 2px solid transparent; border-radius: 10px; background: rgba(255, 255, 255, 0.8); color: #6A517D; font-size: 0.95em; outline: none; }
    .file-input-wrapper { margin: 15px 0; }

    .log-card { background: rgba(255, 255, 255, 0.7); padding: 15px; border-radius: 12px; margin-bottom: 15px; position: relative; }
    .log-date { font-size: 0.8em; font-weight: bold; text-transform: uppercase; margin-bottom: 8px; opacity: 0.8; }
    .log-type { font-weight: bold; color: #6A517D; margin-bottom: 5px; }
    .log-list { margin: 0; padding-left: 20px; font-size: 0.95em; }
    .log-image-preview { width: 100%; max-height: 200px; object-fit: cover; border-radius: 8px; margin-top: 10px; }

    .card-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
    .card-btn { background: rgba(106, 81, 125, 0.15); border: none; color: #6A517D; font-size: 0.8em; font-weight: bold; padding: 6px 10px; border-radius: 6px; cursor: pointer; }
    .card-btn.delete { color: #a83232; background: rgba(168, 50, 50, 0.15); }

    .settings-card { background: rgba(255, 255, 255, 0.6); padding: 20px; border-radius: 15px; margin-top: 15px; }
    .setting-group { margin-bottom: 20px; }
    .setting-group label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 0.9em; }
    .setting-group input[type="time"] { width: 100%; padding: 10px; border: 1px solid #6A517D; border-radius: 8px; background: #fff; color: #6A517D; font-size: 1em; }

  <div class="app-container">
    <h1>🍃 Daily Gratitude</h1>
    <div class="subtitle" id="current-date"></div>

    <nav class="top-nav">
      <button class="nav-item active" id="nav-home" onclick="showPage('home')">🍃 Journal</button>
      <button class="nav-item" id="nav-settings" onclick="showPage('settings')">⚙️ Settings</button>
    </nav>

    <div id="page-home" class="page-view active">
      <div class="tab-buttons">
        <button class="tab-btn active" id="btn-morning" onclick="switchTab('Morning')">☀️ Morning</button>
        <button class="tab-btn" id="btn-evening" onclick="switchTab('Evening')">🌙 Evening</button>
      </div>

      <form id="gratitude-form">
        <input type="hidden" id="editing-id" value="">
        <input type="text" class="gratitude-input" id="entry-1" placeholder="1. I am grateful for..." required>
        <input type="text" class="gratitude-input" id="entry-2" placeholder="2. I am grateful for..." required>
        <input type="text" class="gratitude-input" id="entry-3" placeholder="3. I am grateful for..." required>

        <div class="file-input-wrapper">
          <label for="photo-upload" class="file-label">📷 Attach a Photo (Optional)</label>
          <input type="file" id="photo-upload" accept="image/*" style="display: none;" onchange="updateFileName(this)">
          <div id="file-name" style="text-align: center; font-size: 0.8em; margin-top: 5px; opacity: 0.8;"></div>
        </div>

        <button type="submit" class="action-btn" id="save-btn">Save Gratitude Entry</button>
      </form>

      <div style="margin-top: 30px;">
        <h2>📖 Journal Log</h2>
        <div id="journal-logs"></div>
      </div>
    </div>

    <div id="page-settings" class="page-view">
      <h2>⚙️ Notification Settings</h2>
      
      <div class="settings-card">
        <div class="setting-group">
          <label for="morning-time">☀️ Morning Reminder Time:</label>
          <input type="time" id="morning-time" value="08:00">
        </div>

        <div class="setting-group">
          <label for="evening-time">🌙 Evening Reminder Time:</label>
          <input type="time" id="evening-time" value="20:00">
        </div>

        <button class="action-btn" onclick="saveSettingsAndEnable()">Save & Enable Notifications</button>
      </div>
    </div>
  </div>
