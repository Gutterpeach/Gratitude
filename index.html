<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Gratitude</title>

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#C8A3E6">

  <link rel="manifest" href='data:application/manifest+json,{"name":"Daily Gratitude","short_name":"Gratitude","start_url":"/Gratitude/","display":"standalone","background_color":"#C8A3E6","theme_color":"#C8A3E6","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/2904/2904847.png","sizes":"512x512","type":"image/png"}]}'>

  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #C8A3E6; color: #6A517D; margin: 0; padding: 20px 20px 80px 20px; display: flex; justify-content: center; }
    
    .app-container { width: 100%; max-width: 480px; background: rgba(255, 255, 255, 0.3); padding: 20px; border-radius: 20px; box-shadow: 0 8px 32px 0 rgba(106, 81, 125, 0.15); backdrop-filter: blur(10px); }
    h1, h2 { color: #6A517D; text-align: center; margin-top: 0; }
    .subtitle { text-align: center; font-size: 0.9em; margin-bottom: 20px; opacity: 0.9; }
    
    .page-view { display: none; }
    .page-view.active { display: block; }

    .tab-buttons { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 12px; border: none; border-radius: 12px; background-color: #D1CBD6; color: #6A517D; font-weight: bold; cursor: pointer; }
    .tab-btn.active { background-color: #6A517D; color: #FFFFFF; }
    
    .gratitude-input { width: 100%; padding: 12px; margin-bottom: 12px; border: 2px solid transparent; border-radius: 10px; background: rgba(255, 255, 255, 0.8); color: #6A517D; font-size: 0.95em; outline: none; }
    .file-input-wrapper { margin: 15px 0; }
    .file-label { display: block; padding: 10px; background: #D1CBD6; color: #6A517D; text-align: center; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 0.9em; }
    .action-btn { width: 100%; padding: 14px; border: none; border-radius: 12px; background-color: #6A517D; color: #FFFFFF; font-size: 1em; font-weight: bold; cursor: pointer; margin-top: 10px; }
    
    .log-card { background: rgba(255, 255, 255, 0.7); padding: 15px; border-radius: 12px; margin-bottom: 15px; position: relative; }
    .log-date { font-size: 0.8em; font-weight: bold; text-transform: uppercase; margin-bottom: 8px; opacity: 0.8; }
    .log-type { font-weight: bold; color: #6A517D; margin-bottom: 5px; }
    .log-list { margin: 0; padding-left: 20px; font-size: 0.95em; }
    .log-image-preview { width: 100%; max-height: 200px; object-fit: cover; border-radius: 8px; margin-top: 10px; }

    .card-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
    .card-btn { background: rgba(106, 81, 125, 0.15); border: none; color: #6A517D; font-size: 0.8em; font-weight: bold; padding: 6px 10px; border-radius: 6px; cursor: pointer; }
    .card-btn.delete { color: #a83232; background: rgba(168, 50, 50, 0.15); }

    .settings-card { background: rgba(255, 255, 255, 0.6); padding: 20px; border-radius: 15px; margin-top: 15px; }
    .setting-group { margin-bottom: 20px; }
    .setting-group label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 0.9em; }
    .setting-group input[type="time"] { width: 100%; padding: 10px; border: 1px solid #6A517D; border-radius: 8px; background: #fff; color: #6A517D; font-size: 1em; }

    /* Original Bottom Navigation Bar */
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: rgba(209, 203, 214, 0.95); backdrop-filter: blur(10px); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid rgba(106, 81, 125, 0.2); z-index: 999; }
    .nav-item { border: none; background: none; color: #6A517D; font-weight: bold; font-size: 0.9em; cursor: pointer; opacity: 0.6; padding: 10px 20px; }
    .nav-item.active { opacity: 1; border-bottom: 3px solid #6A517D; }
  </style>
</head>
<body>

  <div class="app-container">
    <h1>🍃 Daily Gratitude</h1>
    <div class="subtitle" id="current-date"></div>

    <div id="page-home" class="page-view active">
      <div class="tab-buttons">
        <button class="tab-btn active" id="btn-morning" onclick="switchTab('Morning')">☀️ Morning</button>
        <button class="tab-btn" id="btn-evening" onclick="switchTab('Evening')">🌙 Evening</button>
      </div>

      <form id="gratitude-form">
        <input type="hidden" id="editing-id" value="">
        <input type="text" class="gratitude-input" id="entry-1" placeholder="1. I am grateful for..." required>
        <input type="text" class="gratitude-input" id="entry-2" placeholder="2. I am grateful for..." required>
        <input type="text" class="gratitude-input" id="entry-3" placeholder="3. I am grateful for..." required>

        <div class="file-input-wrapper">
          <label for="photo-upload" class="file-label">📷 Attach a Photo (Optional)</label>
          <input type="file" id="photo-upload" accept="image/*" style="display: none;" onchange="updateFileName(this)">
          <div id="file-name" style="text-align: center; font-size: 0.8em; margin-top: 5px; opacity: 0.8;"></div>
        </div>

        <button type="submit" class="action-btn" id="save-btn">Save Gratitude Entry</button>
      </form>

      <div style="margin-top: 30px;">
        <h2>📖 Journal Log</h2>
        <div id="journal-logs"></div>
      </div>
    </div>

    <div id="page-settings" class="page-view">
      <h2>⚙️ Notification Settings</h2>
      
      <div class="settings-card">
        <div class="setting-group">
          <label for="morning-time">☀️ Morning Reminder Time:</label>
          <input type="time" id="morning-time" value="08:00">
        </div>

        <div class="setting-group">
          <label for="evening-time">🌙 Evening Reminder Time:</label>
          <input type="time" id="evening-time" value="20:00">
        </div>

        <button class="action-btn" onclick="saveSettingsAndEnable()">Save & Enable Notifications</button>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <button class="nav-item active" id="nav-home" onclick="showPage('home')">🍃 Journal</button>
    <button class="nav-item" id="nav-settings" onclick="showPage('settings')">⚙️ Settings</button>
  </nav>

  <script>
    let currentMode = 'Morning';
    let swRegistration = null;

    const options = { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' };
    document.getElementById('current-date').textContent = new Date().toLocaleDateString(undefined, options);

    if ('serviceWorker' in navigator) {
      const swCode = `
        self.addEventListener('message', (event) => {
          if (event.data && event.data.type === 'SCHEDULE_NOTIFICATION') {
            const { title, body, delay } = event.data;
            setTimeout(() => {
              self.registration.showNotification(title, {
                body: body,
                icon: 'https://cdn-icons-png.flaticon.com/512/2904/2904847.png'
              });
            }, delay);
          }
        });
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      const blobUrl = URL.createObjectURL(blob);

      navigator.serviceWorker.register(blobUrl).then(reg => {
        swRegistration = reg;
      }).catch(err => console.log('SW Registration failed: ', err));
    }

    function showPage(pageName) {
      document.getElementById('page-home').classList.toggle('active', pageName === 'home');
      document.getElementById('page-settings').classList.toggle('active', pageName === 'settings');
      document.getElementById('nav-home').classList.toggle('active', pageName === 'home');
      document.getElementById('nav-settings').classList.toggle('active', pageName === 'settings');
    }

    function switchTab(mode) {
      currentMode = mode;
      document.getElementById('btn-morning').classList.toggle('active', mode === 'Morning');
      document.getElementById('btn-evening').classList.toggle('active', mode === 'Evening');
    }

    function updateFileName(input) {
      document.getElementById('file-name').textContent = input.files[0] ? `Attached: ${input.files[0].name}` : '';
    }

    document.getElementById('gratitude-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const editingId = document.getElementById('editing-id').value;
      const entry1 = document.getElementById('entry-1').value;
      const entry2 = document.getElementById('entry-2').value;
      const entry3 = document.getElementById('entry-3').value;
      const fileInput = document.getElementById('photo-upload');

      if (fileInput.files && fileInput.files[0]) {
        const reader = new FileReader();
        reader.onload = e => saveToStorage(entry1, entry2, entry3, e.target.result, editingId);
        reader.readAsDataURL(fileInput.files[0]);
      } else {
        let existingImage = null;
        if (editingId) {
          const logs = JSON.parse(localStorage.getItem('gratitude_logs') || '[]');
          const current = logs.find(item => item.id == editingId);
          if (current) existingImage = current.image;
        }
        saveToStorage(entry1, entry2, entry3, existingImage, editingId);
      }
    });

    function saveToStorage(e1, e2, e3, image, editingId) {
      let logs = JSON.parse(localStorage.getItem('gratitude_logs') || '[]');

      if (editingId) {
        logs = logs.map(item => {
          if (item.id == editingId) {
            return { ...item, timeOfDay: currentMode, items: [e1, e2, e3], image: image };
          }
          return item;
        });
        alert('Entry updated! 🍃');
      } else {
        logs.unshift({ id: Date.now(), date: new Date().toLocaleDateString(undefined, options), timeOfDay: currentMode, items: [e1, e2, e3], image: image });
        alert(`${currentMode} gratitude saved! 🍃`);
      }

      localStorage.setItem('gratitude_logs', JSON.stringify(logs));
      resetForm();
      renderLogs();
    }

    function resetForm() {
      document.getElementById('gratitude-form').reset();
      document.getElementById('editing-id').value = '';
      document.getElementById('file-name').textContent = '';
      document.getElementById('save-btn').textContent = 'Save Gratitude Entry';
    }

    function editEntry(id) {
      const logs = JSON.parse(localStorage.getItem('gratitude_logs') || '[]');
      const target = logs.find(item => item.id == id);
      if (!target) return;

      switchTab(target.timeOfDay);
      document.getElementById('editing-id').value = target.id;
      document.getElementById('entry-1').value = target.items[0];
      document.getElementById('entry-2').value = target.items[1];
      document.getElementById('entry-3').value = target.items[2];
      document.getElementById('save-btn').textContent = 'Update Gratitude Entry';

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteEntry(id) {
      if (confirm('Are you sure you want to delete this gratitude entry?')) {
        let logs = JSON.parse(localStorage.getItem('gratitude_logs') || '[]');
        logs = logs.filter(item => item.id != id);
        localStorage.setItem('gratitude_logs', JSON.stringify(logs));
        renderLogs();
      }
    }

    function renderLogs() {
      const container = document.getElementById('journal-logs');
      const logs = JSON.parse(localStorage.getItem('gratitude_logs') || '[]');
      if (logs.length === 0) {
        container.innerHTML = '<p style="text-align: center; opacity: 0.7;">No entries yet.</p>';
        return;
      }
      container.innerHTML = logs.map(log => `
        <div class="log-card">
          <div class="log-date">${log.date}</div>
          <div class="log-type">${log.timeOfDay === 'Morning' ? '☀️ Morning' : '🌙 Evening'}</div>
          <ol class="log-list">
            <li>${log.items[0]}</li>
            <li>${log.items[1]}</li>
            <li>${log.items[2]}</li>
          </ol>
          ${log.image ? `<img src="${log.image}" class="log-image-preview">` : ''}
          <div class="card-actions">
            <button class="card-btn" onclick="editEntry(${log.id})">✏️ Edit</button>
            <button class="card-btn delete" onclick="deleteEntry(${log.id})">🗑️ Delete</button>
          </div>
        </div>
      `).join('');
    }

    async function saveSettingsAndEnable() {
      const mTime = document.getElementById('morning-time').value;
      const eTime = document.getElementById('evening-time').value;

      localStorage.setItem('gratitude_m_time', mTime);
      localStorage.setItem('gratitude_e_time', eTime);

      if (!('Notification' in window)) {
        alert('Notifications are not supported in this browser.');
        return;
      }

      const permission = await Notification.requestPermission();
      if (permission === 'granted') {
        scheduleNotification('Morning', mTime);
        scheduleNotification('Evening', eTime);
        alert('Settings saved and reminders activated! 🍃');
        showPage('home');
      } else {
        alert('Notification permission was denied in your browser settings.');
      }
    }

    function loadSavedSettings() {
      const mTime = localStorage.getItem('gratitude_m_time');
      const eTime = localStorage.getItem('gratitude_e_time');
      if (mTime) document.getElementById('morning-time').value = mTime;
      if (eTime) document.getElementById('evening-time').value = eTime;
    }

    function scheduleNotification(type, timeStr) {
      if (!swRegistration || !swRegistration.active) return;

      const [hours, minutes] = timeStr.split(':').map(Number);
      const now = new Date();
      let target = new Date();
      target.setHours(hours, minutes, 0, 0);

      if (target <= now) {
        target.setDate(target.getDate() + 1);
      }

      const delay = target.getTime() - now.getTime();

      swRegistration.active.postMessage({
        type: 'SCHEDULE_NOTIFICATION',
        title: type === 'Morning' ? '☀️ Morning Gratitude 🍃' : '🌙 Evening Gratitude 🍃',
        body: 'Take 2 minutes to record 3 things you are grateful for!',
        delay: delay
      });
    }

    loadSavedSettings();
    renderLogs();
  </script>
</body>
</html>
